services:
  api:
    image: ghcr.io/etalab-ia/albert-api/app:latest
    platform: linux/amd64
    restart: always
    environment:
      - COVERAGE_RCFILE=./app/.coveragerc
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MEILISEARCH_HOST=meilisearch
      - OPENAI_API_KEY=${OPENAI_API_KEY} # replace with your own key
    ports:
      - 8000:8000
    volumes:
      - ./config.yml:/config.yml:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  playground:
    image: ghcr.io/etalab-ia/albert-api/ui:latest
    platform: linux/amd64
    restart: always
    environment:
      - API_HOST=api
      - POSTGRES_HOST=postgres
    ports:
      - 8501:8501
    volumes:
      - ./config.yml:/config.yml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    extends:
      file: compose.yml
      service: postgres

  redis:
    extends:
      file: compose.yml
      service: redis

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-changeme}
    volumes:
      - meilisearch_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres:
  redis:
  meilisearch:
