name: albert-api
services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    environment:
      - COVERAGE_RCFILE=./app/.coveragerc
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MEILISEARCH_HOST=meilisearch
      - API_HOST=api
      - OPENAI_API_KEY=${OPENAI_API_KEY} # replace with your own key
    ports:
      - 8000:8000
    volumes:
      - ./config.yml:/config.yml:ro
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  playground:
    build:
      context: .
      dockerfile: ui/Dockerfile
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    ports:
      - 8501:8501
    environment:
      - API_HOST=api
      - POSTGRES_HOST=postgres
      - MEILISEARCH_HOST=meilisearch
      - REDIS_HOST=redis
    volumes:
      - ./config.yml:/config.yml:ro
    develop:
      watch:
        - action: sync+restart
          path: ./ui
          target: /app
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  postgres:
    extends:
      file: compose.yml
      service: postgres

  redis:
    extends:
      file: compose.yml
      service: redis

  meilisearch:
    extends:
      file: compose.yml
      service: meilisearch

volumes:
  postgres:
  redis:
  meilisearch:
